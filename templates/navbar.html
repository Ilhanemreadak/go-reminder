{{define "navbar"}}
{{if .IsAuthenticated}}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-bell-fill me-2"></i>RemindMe
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {{if eq .ActivePage " reminders"}}active{{end}}" href="/">
                        <i class="bi bi-bell me-1"></i>Hatırlatıcılar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .ActivePage " groups"}}active{{end}}" href="/groups">
                        <i class="bi bi-people me-1"></i>Gruplar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .ActivePage " email-history"}}active{{end}}" href="/email-history">
                        <i class="bi bi-clock-history me-1"></i>E-posta Geçmişi
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{if eq .ActivePage " settings"}}active{{end}}" href="/settings">
                        <i class="bi bi-gear me-1"></i>SMTP Ayarları
                    </a>
                </li>
                <li class="nav-item d-flex align-items-center ms-3">
                    <span class="navbar-text text-light me-2">
                        <i class="bi bi-person-circle me-1"></i>{{.User.Username}}
                    </span>
                    <form method="POST" action="/logout" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-light px-2"
                            style="border: none; background: none;">
                            <i class="bi bi-box-arrow-right me-1"></i>Çıkış
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
{{end}}
{{end}}
